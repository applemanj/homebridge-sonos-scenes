# Deploys the Sonos broker (broker/) to Azure App Service.
# Uses the publish profile secret for authentication (no separate azure/login needed).

name: Deploy Broker to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'broker/**'
      - '.github/workflows/main_sonos-scenes-broker.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Package broker
        run: |
          cd broker
          zip -r ../broker-deploy.zip src package.json

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sonos-scenes-broker'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_80BDB00833CB4520BE847930DD9557F2 }}
          package: broker-deploy.zip

      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://sonos-scenes-broker.azurewebsites.net/healthz
